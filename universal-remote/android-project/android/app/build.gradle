plugins { id 'com.android.application' }
android {
    namespace 'com.blessing.rescuebridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.blessing.rescuebridge'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.6.0-one-install-updater'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
