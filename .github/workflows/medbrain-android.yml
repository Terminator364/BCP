name: MedBrain Android debug APK
on:
  push:
    paths:
      - "mobile-medbrain/**"
      - ".github/workflows/medbrain-android.yml"
    branches:
      - "feat/mobile-medbrain-v0-1-20261010"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: medbrain-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and lint (single worker)
        working-directory: mobile-medbrain
        run: |
          gradle :app:assembleDebug :app:lintDebug --no-daemon --max-workers=1
      - name: Android APK SHA-256
        run: sha256sum mobile-medbrain/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: medbrain-alpha-debug-apk
          path: mobile-medbrain/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
