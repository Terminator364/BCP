name: BCP Windows Bootstrap Validation
# BCP 0.4.1 recovery bridge qualification

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/INSTALL_BCP_FINAL.ps1"
      - "windows/INSTALL_BCP_FINAL.cmd"
      - "windows/bcp_server.py"
      - "windows/BCP_PC_MIGRATE_CURRENT.cmd"
      - "windows/BCP_PC_MIGRATE_CURRENT.ps1"
      - "release/server.json"
      - "tests/chatgpt_pc_register_contract_cli.py"
      - ".github/workflows/windows-bootstrap-validation.yml"
  pull_request:
    paths:
      - "windows/INSTALL_BCP_FINAL.ps1"
      - "windows/INSTALL_BCP_FINAL.cmd"
      - "windows/bcp_server.py"
      - "windows/BCP_PC_MIGRATE_CURRENT.cmd"
      - "windows/BCP_PC_MIGRATE_CURRENT.ps1"
      - "release/server.json"
      - "tests/chatgpt_pc_register_contract_cli.py"
      - ".github/workflows/windows-bootstrap-validation.yml"

permissions:
  contents: read

concurrency:
  group: bcp-windows-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse PowerShell
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\windows\INSTALL_BCP_FINAL.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw "PowerShell parse failed"
          }

      - name: Static regression guards
        shell: powershell
        run: |
          $ps = Get-Content -Raw '.\windows\INSTALL_BCP_FINAL.ps1'
          $cmd = Get-Content -Raw '.\windows\INSTALL_BCP_FINAL.cmd'
          if ($ps -match '(?i)\bschtasks\b' -or $cmd -match '(?i)\bschtasks\b') { throw 'Scheduled tasks are forbidden' }
          if ($ps.Contains('^|') -or $cmd.Contains('^|')) { throw 'Caret-pipe quoting regression found' }
          if ($ps -notmatch 'Tunnel_PC_G4') { throw 'ChatGPT-PC runtime reuse missing' }
          if ($ps -notmatch 'ChatGPT_ManagedApps') { throw 'Managed-app integration missing' }
          if ($ps -notmatch 'RemoteAddress LocalSubnet') { throw 'LAN firewall scope missing' }
          if ($ps -notmatch 'UTF8Encoding\(\$false\)') { throw 'UTF-8 no-BOM writer missing' }

      - name: Installer self-test under Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\INSTALL_BCP_FINAL.ps1' -SelfTest

      - name: BCP server self-test
        shell: powershell
        run: |
          python '.\windows\bcp_server.py' --selftest

      - name: Legacy migration bridge guards
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\windows\BCP_PC_MIGRATE_CURRENT.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw 'Migration PowerShell parse failed'
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\BCP_PC_MIGRATE_CURRENT.ps1' -SelfTest

          $bridge = Get-Content -Raw '.\windows\BCP_PC_MIGRATE_CURRENT.ps1'
          if ($bridge -notmatch 'bcp_supervisor\.ps1') { throw 'legacy supervisor retirement missing' }
          if ($bridge -notmatch 'bcp_token\.txt' -or $bridge -notmatch 'paired_edge\.json') { throw 'legacy identity migration missing' }
          if ($bridge -notmatch 'PORT_8765_NOT_MANAGED_BCP') { throw 'managed listener proof missing' }
          if ($bridge -notmatch 'authenticated_diagnostics') { throw 'authenticated diagnostics proof missing' }
          if ($bridge -notmatch 'BCP_PC_MIGRATION_LATEST\.json') { throw 'Drive receipt proof missing' }
          if ($bridge -notmatch 'c0d10a286a5a4e18d755a31811e7b479f7ad9cff') { throw 'migration bridge pin missing' }
          if ($bridge -notmatch '3ad1594a948768b15f583a7806eb7fb084935ecbcd1ccac0079ce88e43f6d53e') { throw 'installer hash pin missing' }
          if ($bridge -notmatch 'c23e9d79262884b399cfb3abba382dae3c4b18ccbe158fe818e6497f7a493993') { throw 'server hash pin missing' }
          if ($bridge -match '(?i)curl\s+http://' -or $bridge -match '(?i)Invoke-WebRequest.+http://raw') { throw 'insecure download path present' }
          Write-Host 'BCP_LEGACY_MIGRATION_BRIDGE_GUARDS=PASS'

      - name: Upload legacy migration bridge
        uses: actions/upload-artifact@v4
        with:
          name: bcp-pc-legacy-migration-current
          path: |
            windows/BCP_PC_MIGRATE_CURRENT.cmd
            windows/BCP_PC_MIGRATE_CURRENT.ps1
          if-no-files-found: error

      - name: Release manifest integrity
        shell: powershell
        run: |
          $release = Get-Content -Raw '.\release\server.json' -Encoding UTF8 | ConvertFrom-Json
          # Git may materialize CRLF on Windows; the public raw release is canonical LF UTF-8.
          $raw = Get-Content -Raw '.\windows\bcp_server.py' -Encoding UTF8
          $canonical = $raw -replace "`r`n", "`n"
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $bytes = $utf8.GetBytes($canonical)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha.Dispose()
          }
          if ($release.sha256.ToLowerInvariant() -ne $actual) {
            throw "release/server.json SHA-256 does not match windows/bcp_server.py"
          }
          if ($raw -notmatch ('SERVER_VERSION = "' + [regex]::Escape([string]$release.version) + '"')) {
            throw "release/server.json version does not match server source"
          }
          if ($release.auto_update -ne $true -or $release.rollback_on_health_failure -ne $true) {
            throw "server release safety flags are not enabled"
          }

  install-e2e-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Full installer path + ChatGPT-PC registration contract + idempotent reinstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('bcp-e2e-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:LOCALAPPDATA = $sandbox
          $chatRoot = Join-Path $sandbox 'Tunnel_PC_G4'
          New-Item -ItemType Directory -Force -Path (Join-Path $chatRoot 'app'),(Join-Path $chatRoot 'logs') | Out-Null
          Copy-Item -Force '.\tests\chatgpt_pc_register_contract_cli.py' (Join-Path $chatRoot 'app\cli.py')
          $python = (Get-Command python).Source

          function Stop-TestServer {
            Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue | ForEach-Object {
              try { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue } catch {}
            }
          }

          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\INSTALL_BCP_FINAL.ps1' -IntegrationTest -ChatRootOverride $chatRoot -ChatPythonOverride $python
            if ($LASTEXITCODE -ne 0) { throw "first install failed rc=$LASTEXITCODE" }

            $manifest = Join-Path $sandbox 'ChatGPT_ManagedApps\bcp\PCA_APP_MANIFEST.json'
            if (-not (Test-Path -LiteralPath $manifest)) { throw 'manifest missing after install' }
            $bytes = [System.IO.File]::ReadAllBytes($manifest)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw 'manifest contains UTF-8 BOM'
            }

            $receipt = Get-ChildItem (Join-Path $sandbox 'ChatGPT_ManagedApps\bcp\receipts\install-*.json') | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if (-not $receipt) { throw 'PASS receipt missing' }
            $r = Get-Content -Raw -LiteralPath $receipt.FullName -Encoding UTF8 | ConvertFrom-Json
            if ($r.status -ne 'PASS' -or $r.integration_test -ne $true) { throw 'invalid PASS receipt' }

            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\INSTALL_BCP_FINAL.ps1' -IntegrationTest -ChatRootOverride $chatRoot -ChatPythonOverride $python
            if ($LASTEXITCODE -ne 0) { throw "idempotent reinstall failed rc=$LASTEXITCODE" }

            $health = Invoke-RestMethod -UseBasicParsing 'http://127.0.0.1:8765/health' -TimeoutSec 4
            if ($health.ok -ne $true) { throw 'health check failed after reinstall' }
            Write-Host 'BCP_WINDOWS_E2E_SANDBOX=PASS'
          }
          finally {
            Stop-TestServer
            Remove-Item -Recurse -Force -LiteralPath $sandbox -ErrorAction SilentlyContinue
          }

  windows-host-network-probe:
    runs-on: windows-latest
    steps:
      - name: Probe Windows TCP and firewall primitives used by installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Mandatory deterministic network primitive test: real listener + client roundtrip.
          $port = 48765
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, $port)
          try {
            $listener.Start()
            $client = [System.Net.Sockets.TcpClient]::new()
            $client.Connect('127.0.0.1', $port)
            $serverClient = $listener.AcceptTcpClient()

            $payload = [Text.Encoding]::UTF8.GetBytes('BCP-NET-PROBE')
            $client.GetStream().Write($payload, 0, $payload.Length)
            $buf = New-Object byte[] 64
            $n = $serverClient.GetStream().Read($buf, 0, $buf.Length)
            $text = [Text.Encoding]::UTF8.GetString($buf, 0, $n)
            if ($text -ne 'BCP-NET-PROBE') { throw "TCP roundtrip mismatch: $text" }

            $serverClient.Close()
            $client.Close()
            Write-Host 'BCP_WINDOWS_TCP_PRIMITIVES=PASS'
          }
          finally {
            try { $listener.Stop() } catch {}
          }

          # Avoid Get-NetIPConfiguration here: current windows-latest/Server 2025
          # images can throw an internal CIM NetAdapter conversion error before
          # returning any rows. Enumerate adapter + IPv4 address independently.
          $active = $null
          $adapters = @(Get-NetAdapter -ErrorAction Stop | Where-Object { $_.Status -eq 'Up' })
          foreach ($adapter in $adapters) {
            $ipv4 = @(Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue |
              Where-Object { $_.IPAddress -and $_.IPAddress -notlike '169.254.*' } |
              Select-Object -First 1)
            if ($ipv4.Count -gt 0) {
              $active = [pscustomobject]@{
                InterfaceAlias = [string]$adapter.Name
                InterfaceIndex = [int]$adapter.ifIndex
                IPv4 = [string]$ipv4[0].IPAddress
              }
              break
            }
          }
          if (-not $active) { throw 'No active non-APIPA IPv4 interface on runner' }
          Write-Host ("BCP_WINDOWS_IPV4_INTERFACE=PASS alias=" + $active.InterfaceAlias + " ip=" + $active.IPv4)

          # Hosted GitHub runners do not guarantee that Windows Firewall mutation
          # is permitted on every image. When mutation is available, require exact
          # create/readback/delete semantics. When the host refuses mutation, keep
          # that limitation explicit and rely on installer static guards + field
          # readback rather than producing a false product failure.
          $name = 'BCP CI Probe 48765'
          $firewallMutated = $false
          $lastError = $null
          try {
            for ($i = 1; $i -le 3 -and -not $firewallMutated; $i++) {
              try {
                New-NetFirewallRule -DisplayName $name -Direction Inbound -Action Allow -Protocol TCP -LocalPort $port -Profile Private,Domain -RemoteAddress LocalSubnet -ErrorAction Stop | Out-Null
                $firewallMutated = $true
              }
              catch {
                $lastError = $_.Exception.Message
                Start-Sleep -Seconds 2
              }
            }

            if ($firewallMutated) {
              $rule = Get-NetFirewallRule -DisplayName $name -ErrorAction Stop
              if (-not $rule) { throw 'Firewall rule readback failed' }

              $portFilter = $rule | Get-NetFirewallPortFilter
              $addrFilter = $rule | Get-NetFirewallAddressFilter
              if ([string]$portFilter.LocalPort -ne [string]$port) { throw 'Firewall local port readback mismatch' }
              if ([string]$addrFilter.RemoteAddress -notmatch 'LocalSubnet') { throw 'Firewall RemoteAddress readback mismatch' }

              Write-Host 'BCP_WINDOWS_FIREWALL_MUTATION=PASS'
            }
            else {
              Write-Warning ("BCP_WINDOWS_FIREWALL_MUTATION=HOSTED_RUNNER_UNAVAILABLE detail=" + [string]$lastError)

              # Fail closed on product configuration even when the runner host
              # blocks live firewall mutation.
              $installer = Get-Content -Raw '.\windows\INSTALL_BCP_FINAL.ps1'
              if ($installer -notmatch 'RemoteAddress LocalSubnet') { throw 'Installer lost LocalSubnet firewall scope' }
              if ($installer -notmatch 'Profile Private,Domain') { throw 'Installer lost Private/Domain firewall profile scope' }
              Write-Host 'BCP_WINDOWS_FIREWALL_POLICY_STATIC=PASS'
            }
          }
          finally {
            try {
              Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue |
                Remove-NetFirewallRule -ErrorAction SilentlyContinue
            } catch {}
          }

          Write-Host 'BCP_WINDOWS_NETWORK_PRIMITIVES=PASS'
