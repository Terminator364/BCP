name: BCP Android Human-Action Simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "android-b-edge/**"
      - "release/android.json"
      - "release/android_candidate.json"
      - ".project-memory/HUMAN_ACTION_QUALIFICATION_MATRIX.json"
      - ".github/workflows/android-human-action-simulation.yml"
  push:
    branches: [main]
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "android-b-edge/**"
      - "release/android.json"
      - "release/android_candidate.json"
      - ".project-memory/HUMAN_ACTION_QUALIFICATION_MATRIX.json"
      - ".github/workflows/android-human-action-simulation.yml"

permissions:
  contents: read

concurrency:
  group: bcp-android-human-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/bcp-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd -n bcp_api35 -k "system-images;android-35;google_apis;x86_64" --force
          "$SDK/emulator/emulator" -list-avds | tee avd-list-created.txt
          grep -Fx "bcp_api35" avd-list-created.txt >/dev/null

      - name: Build exact debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :android-b-edge:assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"
          APK="android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee android-emulator-apk.sha256
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | tee android-emulator-apk.badging.txt
          grep -F "package: name='com.blessing.bcpedge.evergreen'" android-emulator-apk.badging.txt >/dev/null

      - name: Boot representative Android phone
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK/platform-tools/adb"
          "$SDK/emulator/emulator" -list-avds | tee avd-list-boot.txt
          grep -Fx "bcp_api35" avd-list-boot.txt >/dev/null
          nohup "$SDK/emulator/emulator" -avd bcp_api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048 > emulator.log 2>&1 &
          EMU_PID=$!
          DEVICE=""
          for i in $(seq 1 60); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "ANDROID_EMULATOR_EXITED_BEFORE_ADB"
              tail -200 emulator.log || true
              exit 1
            fi
            DEVICE="$("$ADB" get-state 2>/dev/null || true)"
            if [ "$DEVICE" = "device" ]; then break; fi
            sleep 2
          done
          if [ "$DEVICE" != "device" ]; then
            echo "ANDROID_ADB_DEVICE_TIMEOUT"
            tail -200 emulator.log || true
            exit 1
          fi
          BOOT=""
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "ANDROID_EMULATOR_EXITED_DURING_BOOT"
              tail -200 emulator.log || true
              exit 1
            fi
            BOOT="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          if [ "$BOOT" != "1" ]; then
            echo "ANDROID_BOOT_COMPLETED_TIMEOUT"
            tail -200 emulator.log || true
            exit 1
          fi
          "$ADB" shell input keyevent 82 || true
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          echo "BCP_ANDROID_EMULATOR_BOOT=PASS"

      - name: Install and launch exact user-facing app
        shell: bash
        run: |
          set -euo pipefail
          APK="android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK/platform-tools/adb"
          "$ADB" install -r "$APK" | tee adb-install.txt
          grep -F "Success" adb-install.txt >/dev/null

          # Pre-grant the user-approved dedicated-server runtime capabilities in CI.
          # Real field installation still shows Android's permission UI to the user.
          for P in             android.permission.POST_NOTIFICATIONS             android.permission.NEARBY_WIFI_DEVICES             android.permission.BLUETOOTH_SCAN             android.permission.BLUETOOTH_CONNECT             android.permission.BLUETOOTH_ADVERTISE
          do
            "$ADB" shell pm grant com.blessing.bcpedge.evergreen "$P" || true
          done
          "$ADB" shell dumpsys deviceidle whitelist +com.blessing.bcpedge.evergreen || true

          "$ADB" shell am force-stop com.blessing.bcpedge.evergreen || true
          COMPONENT="$("$ADB" shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER com.blessing.bcpedge.evergreen 2>/dev/null | tr -d '\r' | tail -1)"
          test -n "$COMPONENT"
          echo "$COMPONENT" | tee launcher-component.txt
          "$ADB" shell am start -W -n "$COMPONENT" | tee activity-start.txt
          grep -E "Status: ok|Status:.*ok" activity-start.txt >/dev/null
          sleep 5
          PID="$("$ADB" shell pidof com.blessing.bcpedge.evergreen | tr -d '\r')"
          test -n "$PID"
          echo "BCP_ANDROID_APP_PROCESS=PASS pid=$PID"

      - name: Verify visible primary UI and no immediate crash
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK/platform-tools/adb"
          COMPONENT="$(cat launcher-component.txt)"
          APP_UI_READY=0
          for UI_ATTEMPT in 1 2 3; do
            "$ADB" shell uiautomator dump /sdcard/bcp-window.xml >/dev/null
            "$ADB" pull /sdcard/bcp-window.xml bcp-window.xml >/dev/null
            if grep -F "BCP Edge Server" bcp-window.xml >/dev/null               && grep -F "NŒUD SERVEUR" bcp-window.xml >/dev/null; then
              APP_UI_READY=1
              break
            fi

            # Headless API-35 occasionally surfaces an unrelated Pixel Launcher ANR
            # over the already-running B-EDGE activity. Close only that system dialog,
            # never B-EDGE, then foreground the exact installed component again.
            if grep -F 'resource-id="android:id/aerr_close"' bcp-window.xml >/dev/null \
              && ! grep -E 'BCP Edge|blessing\.bcpedge' bcp-window.xml >/dev/null; then
              # Fixed API-35 CI device is 320x640; this is the center of
              # android:id/aerr_close in the unrelated launcher ANR dialog.
              "$ADB" shell input tap 160 331
              sleep 1
            else
              "$ADB" shell input keyevent 4 || true
            fi
            "$ADB" shell am start -W -n "$COMPONENT" >/dev/null || true
            sleep 2
          done
          test "$APP_UI_READY" = "1"

          # Server controls and governance cards may legitimately be below the initial
          # viewport as the dashboard grows. Exercise bounded real-user scrolling and
          # require every critical card to become visible instead of assuming position.
          FOUND_PERMISSIONS=0
          FOUND_CAPABILITIES=0
          FOUND_MEMORY=0
          FOUND_LAN=0
          # Derive swipe coordinates from the real emulator geometry. The API-35
          # CI phone is currently 320x640; the previous 520x1500 gesture was fully
          # outside that viewport, so all five UI dumps were byte-identical and no
          # scroll ever occurred. Keep this proof geometry-independent.
          WM_SIZE_RAW="$("$ADB" shell wm size | tr -d '\r' | tee wm-size.txt)"
          WM_SIZE="$(printf '%s\n' "$WM_SIZE_RAW" | sed -n 's/.*Physical size: \([0-9][0-9]*x[0-9][0-9]*\).*/\1/p' | tail -1)"
          if [ -z "$WM_SIZE" ]; then
            WM_SIZE="$(printf '%s\n' "$WM_SIZE_RAW" | sed -n 's/.*Override size: \([0-9][0-9]*x[0-9][0-9]*\).*/\1/p' | tail -1)"
          fi
          test -n "$WM_SIZE"
          SCREEN_W="${WM_SIZE%x*}"
          SCREEN_H="${WM_SIZE#*x}"
          test "$SCREEN_W" -gt 0
          test "$SCREEN_H" -gt 0
          SWIPE_X=$((SCREEN_W / 2))
          SWIPE_Y1=$((SCREEN_H * 82 / 100))
          SWIPE_Y2=$((SCREEN_H * 28 / 100))
          test "$SWIPE_Y1" -gt "$SWIPE_Y2"
          echo "BCP_ANDROID_SCROLL_GEOMETRY=${SCREEN_W}x${SCREEN_H} x=${SWIPE_X} y1=${SWIPE_Y1} y2=${SWIPE_Y2}" | tee scroll-geometry.txt

          : > bcp-window-lower.xml
          PREV_DUMP_SHA="$(sha256sum bcp-window.xml | awk '{print $1}')"
          echo "step=0 sha256=$PREV_DUMP_SHA" > scroll-dump-sha256.txt
          SCROLL_CHANGED=0
          for STEP in 1 2 3 4 5; do
            "$ADB" shell input swipe "$SWIPE_X" "$SWIPE_Y1" "$SWIPE_X" "$SWIPE_Y2" 420
            sleep 1
            "$ADB" shell uiautomator dump "/sdcard/bcp-window-$STEP.xml" >/dev/null
            "$ADB" pull "/sdcard/bcp-window-$STEP.xml" "bcp-window-$STEP.xml" >/dev/null
            CURRENT_DUMP_SHA="$(sha256sum "bcp-window-$STEP.xml" | awk '{print $1}')"
            echo "step=$STEP sha256=$CURRENT_DUMP_SHA" >> scroll-dump-sha256.txt
            if [ -n "$PREV_DUMP_SHA" ] && [ "$CURRENT_DUMP_SHA" != "$PREV_DUMP_SHA" ]; then
              SCROLL_CHANGED=1
            fi
            PREV_DUMP_SHA="$CURRENT_DUMP_SHA"
            cat "bcp-window-$STEP.xml" >> bcp-window-lower.xml
            grep -F "AUTORISATIONS SERVEUR" "bcp-window-$STEP.xml" >/dev/null && FOUND_PERMISSIONS=1 || true
            grep -F "CAPACITÉS DU NŒUD" "bcp-window-$STEP.xml" >/dev/null && FOUND_CAPABILITIES=1 || true
            grep -F "Journal mémoire/provenance:" "bcp-window-$STEP.xml" >/dev/null && FOUND_MEMORY=1 || true
            grep -F "Sécurité LAN 2.2: TLS pinné bidirectionnel · legacy 2.1.2 isolé" "bcp-window-$STEP.xml" >/dev/null && FOUND_LAN=1 || true
          done
          test "$SCROLL_CHANGED" = "1"
          test "$FOUND_PERMISSIONS" = "1"
          test "$FOUND_CAPABILITIES" = "1"
          test "$FOUND_MEMORY" = "1"
          test "$FOUND_LAN" = "1"
          "$ADB" exec-out screencap -p > bcp-server-dashboard-lower.png
          test -s bcp-server-dashboard-lower.png

          if "$ADB" logcat -d -t 400 | grep -E "FATAL EXCEPTION: main|Process: com\.blessing\.bcpedge\.evergreen.*has died"; then
            echo "Immediate B-EDGE crash detected"
            exit 1
          fi
          "$ADB" exec-out screencap -p > bcp-server-dashboard.png
          test -s bcp-server-dashboard.png
          echo "BCP_ANDROID_PRIMARY_UI=PASS"

      - name: Verify real local phone API server surface
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK/platform-tools/adb"
          "$ADB" forward --remove-all || true
          "$ADB" forward tcp:18877 tcp:8877
          CODE=""
          for i in $(seq 1 20); do
            CODE="$(curl -ksS -o edge-health.json -w '%{http_code}' https://127.0.0.1:18877/health || true)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 1
          done
          test "$CODE" = "200"
          python - <<'PY'
          import json,re
          obj=json.load(open("edge-health.json", encoding="utf-8"))
          assert obj["ok"] is True
          assert obj["role"] == "DEDICATED_EDGE_API_SERVER"
          assert obj["port"] == 8877
          assert obj["api_tls"] is True
          assert obj["api_scheme"] == "https"
          assert re.fullmatch(r"[0-9a-f]{64}", obj["api_tls_cert_sha256"])
          open("edge-tls-cert.sha256","w",encoding="utf-8").write(obj["api_tls_cert_sha256"]+"\n")
          PY

          curl -kfsS https://127.0.0.1:18877/v1/node/capabilities -o edge-capabilities.json
          python - <<'PY'
          import json
          obj=json.load(open("edge-capabilities.json", encoding="utf-8"))
          assert obj["ok"] is True
          assert obj["local_api"] is True
          assert obj["durable_queue"] is True
          assert obj["content_addressed_private_cache"] is True
          assert obj["store_and_forward"] is True
          assert obj["telegram_https_connect_relay"] is True
          assert obj["capability_registry"] is True
          assert obj["memory_admission_ledger"] is True
          assert obj["room_schema_version"] == 5
          assert obj["arbitrary_proxy"] is False
          assert obj["arbitrary_shell"] is False
          PY

          PRIVATE_CODE="$(curl -ksS -o edge-private-unauthorized.json -w '%{http_code}' https://127.0.0.1:18877/v1/node/status)"
          test "$PRIVATE_CODE" = "401"
          grep -F '"unauthorized"' edge-private-unauthorized.json >/dev/null
          for PATHNAME in v1/node/capability-registry v1/node/memory-claims; do
            CODE="$(curl -ksS -o "edge-private-${PATHNAME##*/}.json" -w '%{http_code}' "https://127.0.0.1:18877/$PATHNAME")"
            test "$CODE" = "401"
            grep -F '"unauthorized"' "edge-private-${PATHNAME##*/}.json" >/dev/null
          done
          echo "BCP_ANDROID_LOCAL_API_SERVER=PASS"

      - name: Cold relaunch idempotence smoke
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK/platform-tools/adb"
          "$ADB" shell am force-stop com.blessing.bcpedge.evergreen
          sleep 1
          COMPONENT="$(cat launcher-component.txt)"
          test -n "$COMPONENT"
          "$ADB" shell am start -W -n "$COMPONENT" | tee activity-relaunch.txt
          sleep 4
          PID="$("$ADB" shell pidof com.blessing.bcpedge.evergreen | tr -d '\r')"
          test -n "$PID"
          "$ADB" shell uiautomator dump /sdcard/bcp-window-relaunch.xml >/dev/null
          "$ADB" pull /sdcard/bcp-window-relaunch.xml bcp-window-relaunch.xml >/dev/null
          grep -F "BCP Edge Server" bcp-window-relaunch.xml >/dev/null
          "$ADB" forward tcp:18878 tcp:8877
          CODE="$(curl -ksS -o edge-health-relaunch.json -w '%{http_code}' https://127.0.0.1:18878/health || true)"
          test "$CODE" = "200"
          grep -F '"DEDICATED_EDGE_API_SERVER"' edge-health-relaunch.json >/dev/null
          echo "BCP_ANDROID_COLD_RELAUNCH=PASS"

      - name: Capture Android runtime diagnostics
        if: always()
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK/platform-tools/adb"
          "$ADB" logcat -d -v threadtime > bcp-logcat.txt 2>&1 || true
          "$ADB" shell dumpsys activity services com.blessing.bcpedge.evergreen > bcp-service-dumpsys.txt 2>&1 || true
          grep -E "TLS_API|SSLHandshake|KeyStore|AndroidKeyStore|B-EDGE|bcpedge" bcp-logcat.txt | tail -250 > bcp-tls-log-extract.txt || true

      - name: Upload representative simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcp-android-human-action-simulation
          path: |
            android-emulator-apk.sha256
            android-emulator-apk.badging.txt
            activity-start.txt
            launcher-component.txt
            activity-relaunch.txt
            bcp-window.xml
            bcp-window-lower.xml
            wm-size.txt
            scroll-geometry.txt
            scroll-dump-sha256.txt
            bcp-server-dashboard.png
            bcp-server-dashboard-lower.png
            bcp-window-relaunch.xml
            edge-health.json
            edge-tls-cert.sha256
            edge-capabilities.json
            edge-private-unauthorized.json
            edge-private-capability-registry.json
            edge-private-memory-claims.json
            edge-health-relaunch.json
            emulator.log
            bcp-logcat.txt
            bcp-service-dumpsys.txt
            bcp-tls-log-extract.txt
            avd-list-created.txt
            avd-list-boot.txt
          if-no-files-found: ignore
