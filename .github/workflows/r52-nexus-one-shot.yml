name: BCP Nexus One-Shot Human-Action Qualification

on:
  pull_request:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/NEXUS_AUTH_RETRY_CURRENT.ps1"
      - "windows/NEXUS_AUTH_RETRY_CURRENT.cmd"
      - ".project-memory/DELIVERY_REDUNDANCY_POLICY.json"
      - "tools/test_nexus_auth_retry_helper.py"
      - "tools/test_nexus_retry_runtime.py"
      - "tools/mock_nexus_retry_server.py"
      - "windows/bcp_server.py"
      - ".github/workflows/r52-nexus-one-shot.yml"
  push:
    branches: [main]
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/NEXUS_AUTH_RETRY_CURRENT.ps1"
      - "windows/NEXUS_AUTH_RETRY_CURRENT.cmd"
      - ".project-memory/DELIVERY_REDUNDANCY_POLICY.json"
      - "tools/test_nexus_auth_retry_helper.py"
      - ".github/workflows/r52-nexus-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-helper:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static helper contract
        shell: pwsh
        run: python tools/test_nexus_auth_retry_helper.py
      - name: Runtime simulation of explicit retry path
        shell: pwsh
        run: python tools/test_nexus_retry_runtime.py
      - name: Exact one-shot helper simulation
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "bcp-localappdata"
          $state = Join-Path $env:LOCALAPPDATA "ChatGPT_ManagedApps\bcp\state"
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Set-Content -LiteralPath (Join-Path $state "bcp_token.txt") -Value "ci-test-token" -Encoding ascii

          function Invoke-SimulatedRetry([int]$status, [int]$expectedRc, [string]$expectedText) {
            $stdout = Join-Path $env:RUNNER_TEMP ("mock-" + $status + ".out")
            $stderr = Join-Path $env:RUNNER_TEMP ("mock-" + $status + ".err")
            $proc = Start-Process python -ArgumentList @("tools/mock_nexus_retry_server.py","--status",[string]$status) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              Start-Sleep -Milliseconds 800
              $output = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\windows\NEXUS_AUTH_RETRY_CURRENT.ps1" 2>&1 | Out-String
              $rc = $LASTEXITCODE
              Write-Host $output
              if ($rc -ne $expectedRc) { throw "unexpected helper rc=$rc expected=$expectedRc status=$status" }
              if ($output -notmatch [regex]::Escape($expectedText)) { throw "missing expected output: $expectedText" }
            }
            finally {
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
              Start-Sleep -Milliseconds 300
            }
          }

          Invoke-SimulatedRetry 202 0 "NEXUS_FRESH_DEVICE_FLOW_STARTED"
          Invoke-SimulatedRetry 500 20 "NEXUS_RETRY_REQUEST_FAILED"
          Write-Host "R58_EXACT_NEXUS_HELPER_SIMULATION=PASS"
          exit 0

      - name: PowerShell parse
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows/NEXUS_AUTH_RETRY_CURRENT.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host "R52_POWERSHELL_PARSE=PASS"
