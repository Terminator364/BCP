name: BCP Telegram Observability Qualification
# R54 exact-head qualification fence: human presentation + mail-first + Kinshasa PDF parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/bcp_telegram_observability.py"
      - "windows/CONFIGURE_BCP_TELEGRAM.ps1"
      - "release/telegram_observability.json"
      - "docs/TELEGRAM_*.md"
      - "docs/CANONICAL_PRODUCT_REQUIREMENTS.md"
      - ".project-memory/TELEGRAM_OBSERVABILITY_IMPLEMENTATION_STATE.json"
      - ".github/workflows/telegram-observability.yml"
  push:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/bcp_telegram_observability.py"
      - "windows/CONFIGURE_BCP_TELEGRAM.ps1"
      - "docs/TELEGRAM_*.md"
      - "docs/CANONICAL_PRODUCT_REQUIREMENTS.md"
      - ".project-memory/TELEGRAM_OBSERVABILITY_IMPLEMENTATION_STATE.json"
      - ".github/workflows/telegram-observability.yml"

permissions:
  contents: read

concurrency:
  group: bcp-telegram-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile windows/bcp_telegram_observability.py
      - name: Read-only observability self-test
        run: python windows/bcp_telegram_observability.py --selftest

  powershell-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and self-test configurator
        shell: powershell
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw '.\windows\CONFIGURE_BCP_TELEGRAM.ps1'))
          & '.\windows\CONFIGURE_BCP_TELEGRAM.ps1' -SelfTest

  contract-and-secret-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only contract and no committed bot token
        shell: python
        run: |
          import pathlib, re
          py = pathlib.Path("windows/bcp_telegram_observability.py").read_text(encoding="utf-8")
          ps = pathlib.Path("windows/CONFIGURE_BCP_TELEGRAM.ps1").read_text(encoding="utf-8")
          joined = py + "\n" + ps
          required = [
              "/continue", "/status", "/conversations", "/conversation", "/objective", "/missions", "/details", "/report", "/reporttech", "/project", "/job", "/tail", "/where", "/last", "/ci", "/holds",
              "OBSERVED_CHAT_ACTION", "CHAT_WAITING",
              "CHAT_PLATFORM_HOLD_REPORTED", "UNKNOWN_INTERNAL_CHAT_STATE",
              "ACCEPTED", "NORMALIZED", "PLANNED", "QUEUED", "STARTED",
              "DISPATCHED", "WAITING_PROVIDER", "RESULT_RECEIVED",
              "VALIDATING", "COMMITTED", "CHECKPOINTED", "RETRY_SCHEDULED",
              "BLOCKED", "HOLD", "DONE", "CANCELLED",
              "READ_ONLY", "getUpdates", "DIRECT_TRANSPORT_OUTAGE",
              "telegram_transport_outage.json", "FRESH_NEXUS_AUTHORIZATION_REQUIRED",
          ]
          for item in required:
              assert item in joined, item
          assert not re.search(r"\b\d{6,12}:[A-Za-z0-9_-]{20,}\b", joined)
          for forbidden in ["import requests", "import aiohttp", "import telebot", "from telegram"]:
              assert forbidden not in py
          assert "api.telegram.org/bot" in py
          assert "editMessageText" in py
          assert "callback_query" in py
          assert "answerCallbackQuery" in py
          assert "sendDocument" in py
          assert "inline_keyboard" in py
          assert "bcp:pdf:summary" in py
          assert "bcp:pdf:technical" in py
          assert "text_pdf_bytes" in py
          assert "telegram_system_presence_state" in py
          assert "💰 Coût: $0.00" not in py.split("def details", 1)[0]
          assert "AsSecureString" in ps
          assert "allowed_chat_id" in joined
          assert "aggressive_polling = $false" in ps
          assert "auto_push = $true" in ps
          assert "MISSION_EVENT_LOG" in py
          assert "telegram_presence_state" in py
          assert "bcp:continue" in py
          assert "bcp:conversations" in py
          assert "conversation_threads" in py
          assert "CHATGPT_UI_DELIVERY_UNKNOWN" in py
          assert "conversation_delivery_gaps" in py
          assert "Réponse sauvegardée mais lecture non confirmée" in py
          assert "delivery_gap_count" in py
          assert "📚 Rapports & technique" in py
          assert "def advanced_keyboard" in py
          assert "mail miroir d’abord" in py
          assert "conversation_sequence_gaps" in py
          assert "Synchronisation incomplète" in py
          assert "sequence_gap_count" in py
          assert "conversation_producer_sync" in py
          assert "Synchronisation complète jusqu’au message" in py
          assert "announced_sequence" in py
          assert "chatgpt_pc_flow_bridge" in py
          assert "Connexion ChatGPT-PC" in py
          assert "conversation_latency_summary" in py
          assert "Décomposition temporelle" in py
          assert "human_timestamp" in py
          assert "KINSHASA_TZ" in py
          assert "/Encoding /WinAnsiEncoding" in py
          assert "/BaseFont /Helvetica-Bold" in py
          assert "ACTION POUR VOUS" in py
          assert "Heure affichée : Kinshasa" in py
          devices = py.split("def report_devices", 1)[1].split("def report_mission", 1)[0]
          mission = py.split("def report_mission", 1)[1].split("def report_technical", 1)[0]
          summary = py.split("def report_summary", 1)[1].split("def report_devices", 1)[0]
          technical = py.split("def report_technical", 1)[1].split("def report_pdf", 1)[0]
          for human_block in (summary, devices, mission):
              assert "utc_now()" not in human_block
              assert "nexus_bootstrap_error_class" not in human_block
              assert "mission_id:" not in human_block
          assert "SNAPSHOT GITHUB" not in technical
          assert "MISSION_RESUME_REQUESTS.jsonl" in py
          assert "watchdog_notice" in py
          assert "WATCHDOG_NOTIFY_STATE_PATH" in py
          print("BCP_TELEGRAM_CONTRACT_GUARDS=PASS")

  package:
    runs-on: ubuntu-latest
    needs: [python-selftest, powershell-selftest, contract-and-secret-guards]
    steps:
      - uses: actions/checkout@v4
      - name: Build auditable source package
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          files = [
              pathlib.Path("windows/bcp_telegram_observability.py"),
              pathlib.Path("windows/CONFIGURE_BCP_TELEGRAM.ps1"),
              pathlib.Path("docs/TELEGRAM_BOT_SETUP_AND_FIELD_GATE.md"),
              pathlib.Path("docs/TELEGRAM_HUMAN_COCKPIT_V4_INTERACTIVE_EXPORTS.md"),
          ]
          out = pathlib.Path("BCP_TELEGRAM_OBSERVABILITY_MVP.zip")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, p.name)
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path(str(out) + ".sha256").write_text(
              digest + "  " + out.name + "\n", encoding="ascii"
          )
          print("PACKAGE_SHA256=" + digest)
      - uses: actions/upload-artifact@v4
        with:
          name: bcp-telegram-observability-mvp-${{ github.sha }}
          path: |
            BCP_TELEGRAM_OBSERVABILITY_MVP.zip
            BCP_TELEGRAM_OBSERVABILITY_MVP.zip.sha256
          if-no-files-found: error
