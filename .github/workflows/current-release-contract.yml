name: BCP Qualified CURRENT Release Contract
# R54 exact-head qualification fence: human presentation + mail-first + Kinshasa PDF parity
# Companion release is qualified against the exact branch head.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/INSTALL_BCP_FINAL.ps1"
      - "windows/BCP_FINAL_ACCEPTANCE_CURRENT.ps1"
      - "release/current.json"
      - "release/server.json"
      - "release/android.json"
      - "release/telegram_observability.json"
      - "release/nexus_bootstrap.json"
      - "schemas/bcp_current_release.schema.json"
      - "tools/validate_current_release.py"
      - "tools/test_active_tranche_delivery.py"
      - "windows/bcp_server.py"
      - "android-b-edge/**"
      - "docs/CANONICAL_PRODUCT_REQUIREMENTS.md"
      - ".project-memory/INTERACTIVE_WORK_CADENCE_POLICY.json"
      - ".project-memory/DELIVERY_REDUNDANCY_POLICY.json"
      - ".project-memory/PRE_HUMAN_ACTION_SIMULATION_POLICY.json"
      - ".project-memory/COMMUNICATION_SURVIVAL_POLICY.json"
      - "project_state.json"
      - "API_PROJECT_CONTINUITY.md"
      - ".project-memory/UNIVERSAL_CONTINUATION_CODE_REGISTRY.json"
      - ".project-memory/ACTIVE_TRANCHE.json"
      - ".project-memory/HUMAN_ACTION_QUALIFICATION_MATRIX.json"
      - ".github/workflows/current-release-contract.yml"
  push:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/INSTALL_BCP_FINAL.ps1"
      - "windows/BCP_FINAL_ACCEPTANCE_CURRENT.ps1"
      - "release/current.json"
      - "release/server.json"
      - "release/android.json"
      - "release/telegram_observability.json"
      - "release/nexus_bootstrap.json"
      - "schemas/bcp_current_release.schema.json"
      - "tools/validate_current_release.py"
      - "windows/bcp_server.py"
      - "android-b-edge/**"
      - "docs/CANONICAL_PRODUCT_REQUIREMENTS.md"
      - ".github/workflows/current-release-contract.yml"

permissions:
  contents: read

concurrency:
  group: bcp-current-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse JSON artifacts
        run: |
          python -m json.tool release/current.json > /dev/null
          python -m json.tool release/server.json > /dev/null
          python -m json.tool release/android.json > /dev/null
          python -m json.tool release/telegram_observability.json > /dev/null
          python -m json.tool release/nexus_bootstrap.json > /dev/null
          python -m json.tool schemas/bcp_current_release.schema.json > /dev/null
          python -m json.tool .project-memory/PRE_HUMAN_ACTION_SIMULATION_POLICY.json > /dev/null
          python -m json.tool .project-memory/HUMAN_ACTION_QUALIFICATION_MATRIX.json > /dev/null
          python -m json.tool .project-memory/DELIVERY_REDUNDANCY_POLICY.json > /dev/null
          python -m json.tool .project-memory/INTERACTIVE_WORK_CADENCE_POLICY.json > /dev/null
          python -m json.tool .project-memory/COMMUNICATION_SURVIVAL_POLICY.json > /dev/null
          python -m json.tool .project-memory/ACTIVE_TRANCHE.json > /dev/null
          python -m json.tool .project-memory/UNIVERSAL_CONTINUATION_CODE_REGISTRY.json > /dev/null
          python -m json.tool project_state.json > /dev/null

      - name: Validate CURRENT truth contract
        run: python tools/validate_current_release.py

      - name: Validate active-tranche delivery proof
        run: python tools/test_active_tranche_delivery.py

      - name: Server update self-test
        run: python windows/bcp_server.py --selftest

      - name: Automatic-update implementation guards
        shell: python
        run: |
          import pathlib
          server = pathlib.Path("windows/bcp_server.py").read_text(encoding="utf-8")
          edge = pathlib.Path("android-b-edge/src/main/java/com/blessing/bcpedge/UpdateManager.java").read_text(encoding="utf-8")
          client = pathlib.Path("android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java").read_text(encoding="utf-8")
          required_server = [
              "AUTO_UPDATE_INTERVAL_SECONDS",
              "NEXUS_HUMAN_GATE_MANIFEST_WATCH_SECONDS",
              "NEXUS_HUMAN_GATE_MANIFEST_WATCH_MAX_BACKOFF_SECONDS",
              "start_nexus_human_gate_manifest_watcher",
              "HUMAN_GATE_FAST_PATH",
              "start_auto_update_worker",
              "update_sha256_mismatch",
              "candidate_selftest_failed",
              "ROLLED_BACK",
              "/v1/edge/update",
              "/v1/edge/update/apk",
              "edge_apk_sha256_mismatch",
              "TELEGRAM_COMPANION_MANIFEST_URL",
              "telegram_companion_update_status",
              "apply_telegram_companion_update",
              "telegram_companion_sha256_mismatch",
              "telegram_companion_selftest_failed",
              "NEXUS_BOOTSTRAP_MANIFEST_URL",
              "nexus_bootstrap_delivery_status",
              "apply_nexus_bootstrap_delivery",
              "nexus_bootstrap_sha256_mismatch",
              "NEXUS_BOOTSTRAP_RETRY_BASE_SECONDS",
              "NEXUS_BOOTSTRAP_RETRY_MAX_SECONDS",
              "NEXUS_BOOTSTRAP_MAX_AUTO_ATTEMPTS",
              "NEXUS_BOOTSTRAP_PROCESS_TIMEOUT_SECONDS",
              "NEXUS_BOOTSTRAP_LOCK",
              "_terminate_nexus_process_tree",
              "_nexus_retry_policy",
              "HUMAN_AUTH_REQUIRED",
              "NEXUS_BOOTSTRAP_RETRY_SCHEDULED",
              "/v1/system/nexus",
              "/v1/system/nexus/apply",
              "conversation_delivery_gaps",
              '["v1", "conversations", "gaps"]',
              "DERIVED_FROM_BCP_RECEIPTS_NOT_CHATGPT_INTERNAL_STATE",
              "CONVERSATION_RECEIPTS.jsonl",
              "process_conversation_receipt_inbox",
              "conversation_sequence_gaps",
              '["v1", "conversations", "sequence-gaps"]',
              "conversation_producers",
              "conversation_register_producer",
              "conversation_receipt_ack.json",
              '["v1", "conversations", "producers"]',
              '"producer-heartbeat"',
              "sync_chatgpt_pc_flow_ledger",
              "flow_ledger.sqlite3",
              "mode=ro",
              "CHATGPT_PC_FLOW_LEDGER",
              "conversation_latency_summary",
              "MEASURED_FROM_DURABLE_RECEIPT_TIMESTAMPS_ONLY",
              "_write_utf16_recovery_vbs",
              "ChatGPTPC_RecoveryPlane.vbs",
              "RECOVERY_LAUNCHER_REPAIRED_AND_STARTED",
              "LOCAL_TARGET_NOT_ACTIVE_BRIDGE_STARTED",
              "PACKAGE_SYNC_PENDING_BRIDGE_STARTED",
              "recovery_vbs_utf16_bom_missing",
          ]
          required_edge = [
              "updates",
              "APK_SHA256_MISMATCH",
              "APK_SIGNING_CERT_MISMATCH",
              "pending_version_code",
              "cleanupUpdateCache",
          ]
          for item in required_server:
              assert item in server, item
          for item in required_edge:
              assert item in edge, item
          companion = __import__("json").loads(pathlib.Path("release/telegram_observability.json").read_text(encoding="utf-8"))
          worker_bytes = pathlib.Path("windows/bcp_telegram_observability.py").read_bytes()
          import hashlib
          assert companion["schema"] == "bcp.telegram_companion_release/1"
          assert companion["minimum_server_version"] == "0.6.3"
          assert companion["sha256"] == hashlib.sha256(worker_bytes).hexdigest()
          assert companion["url"].startswith("https://raw.githubusercontent.com/Terminator364/BCP/")
          nexus = __import__("json").loads(pathlib.Path("release/nexus_bootstrap.json").read_text(encoding="utf-8"))
          assert nexus["schema"] == "bcp.nexus_bootstrap_release/1"
          assert nexus["minimum_server_version"] == "0.6.4"
          assert nexus["auto_stage"] is True and nexus["auto_launch_once"] is True and nexus["zero_usd"] is True
          for item in nexus["files"]:
              p = pathlib.Path(item["path"])
              assert p.is_file(), item["path"]
              assert item["sha256"] == hashlib.sha256(p.read_bytes()).hexdigest(), item["path"]
              assert item["url"].startswith("https://raw.githubusercontent.com/Terminator364/BCP/")
          assert "autoPromoteServerIfNeeded" in client
          assert "updates.check()" in pathlib.Path(
              "android-b-edge/src/main/java/com/blessing/bcpedge/MainActivity.java"
          ).read_text(encoding="utf-8")
          print("BCP_AUTOMATIC_UPDATE_GUARDS=PASS")

      - name: Zero manual/scheduled automation contract
        shell: python
        run: |
          import json, pathlib
          m = json.loads(pathlib.Path("release/current.json").read_text())
          p = m["update_policy"]
          assert p["scheduled_chatgpt_automation"] is False
          assert p["unchanged_version_zero_download"] is True
          assert p["metered_large_download_default"] is False
          assert m["zero_usd"] is True
          print("BCP_ZERO_MANUAL_UPDATE_POLICY=PASS")
