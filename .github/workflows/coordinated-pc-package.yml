name: BCP Coordinated PC Package

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/INSTALL_BCP_FINAL.cmd"
      - "windows/INSTALL_BCP_FINAL.ps1"
      - "windows/BCP_FINAL_ACCEPTANCE_CURRENT.cmd"
      - "windows/BCP_FINAL_ACCEPTANCE_CURRENT.ps1"
      - "windows/bcp_server.py"
      - "release/server.json"
      - ".github/workflows/coordinated-pc-package.yml"

permissions:
  contents: read

concurrency:
  group: bcp-coordinated-pc-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Server self-test
        shell: powershell
        run: |
          python '.\windows\bcp_server.py' --selftest

      - name: Installer self-test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\INSTALL_BCP_FINAL.ps1' -SelfTest

      - name: Acceptance self-test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\BCP_FINAL_ACCEPTANCE_CURRENT.ps1' -SelfTest

      - name: Cross-check coordinated version and SHA
        shell: powershell
        run: |
          $release=Get-Content -Raw '.\release\server.json' -Encoding UTF8|ConvertFrom-Json
          $server=Get-Content -Raw '.\windows\bcp_server.py' -Encoding UTF8
          if($release.version -ne '0.5.0'){throw 'SERVER_VERSION_NOT_0_5_0'}
          if($server -notmatch 'SERVER_VERSION = "0.5.0"'){throw 'SOURCE_VERSION_DRIFT'}
          $sha=(Get-FileHash -Algorithm SHA256 '.\windows\bcp_server.py').Hash.ToLowerInvariant()
          if($sha -ne ([string]$release.sha256).ToLowerInvariant()){throw "SERVER_SHA_MISMATCH manifest=$($release.sha256) actual=$sha"}
          if($release.coordinated_edge_version -ne '1.1.0-evergreen'){throw 'EDGE_VERSION_CONTRACT_DRIFT'}

      - name: Build PC package
        shell: powershell
        run: |
          $root='BCP_PC_0_5_0'
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item windows\INSTALL_BCP_FINAL.cmd $root\
          Copy-Item windows\INSTALL_BCP_FINAL.ps1 $root\
          Copy-Item windows\bcp_server.py $root\
          Copy-Item windows\BCP_FINAL_ACCEPTANCE_CURRENT.cmd $root\
          Copy-Item windows\BCP_FINAL_ACCEPTANCE_CURRENT.ps1 $root\
          Copy-Item release\server.json $root\
          $hashes=@{}
          Get-ChildItem $root -File | ForEach-Object {
            $hashes[$_.Name]=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
          }
          [ordered]@{
            schema='bcp.pc.package/1'
            version='0.5.0'
            coordinated_edge_version='1.1.0-evergreen'
            source_commit='${{ github.sha }}'
            files=$hashes
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $root\PC_PACKAGE_MANIFEST.json
          Compress-Archive -Path $root\* -DestinationPath BCP_PC_0_5_0.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: bcp-pc-0.5.0-coordinated
          path: BCP_PC_0_5_0.zip
          if-no-files-found: error
