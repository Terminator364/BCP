name: BCP Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-b-edge/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"

concurrency:
  group: bcp-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-pc-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PC node tests
        run: python pc-node/test_bcp.py

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK components
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Edge privacy and observability regression guards
        shell: bash
        run: |
          set -euo pipefail
          MAIN="android-b-edge/src/main/java/com/blessing/bcpedge/MainActivity.java"
          CLIENT="android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java"
          TELE="android-b-edge/src/main/java/com/blessing/bcpedge/TelemetryStore.java"
          if grep -F 'output.setText(r.toString())' "$MAIN"; then
            echo "Raw pairing response must never be rendered in normal UI"
            exit 1
          fi
          grep -F 'Identifiants: masqués' "$MAIN" >/dev/null
          grep -F 'stored_securely_not_displayed' "$CLIENT" >/dev/null
          grep -F 'PHONE_HEARTBEAT' "$CLIENT" >/dev/null
          grep -F '0.2.2' "$TELE" >/dev/null
          if grep -E 'output\.setText\([^)]*token|detail\.setText\([^)]*token' "$MAIN"; then
            echo "Credential rendering regression detected"
            exit 1
          fi
          echo "EDGE_PRIVACY_OBSERVABILITY_GUARDS=PASS"

      - name: Build debug APK
        run: gradle :android-b-edge:assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"

      - name: SHA-256
        run: sha256sum android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk | tee android-b-edge-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-b-edge-debug-apk
          path: |
            android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk
            android-b-edge-debug.apk.sha256
          if-no-files-found: error
