name: BCP Android Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "android-b-edge/**"
      - "release/android.json"
      - "release/android_candidate.json"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  push:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "android-b-edge/**"
      - "release/android.json"
      - "release/android_candidate.json"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"

concurrency:
  group: bcp-android-evergreen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK components
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Evergreen security / continuity static guards
        shell: bash
        run: |
          set -euo pipefail
          MAIN="android-b-edge/src/main/java/com/blessing/bcpedge/MainActivity.java"
          CLIENT="android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java"
          UPDATE="android-b-edge/src/main/java/com/blessing/bcpedge/UpdateManager.java"
          POLICY="android-b-edge/src/main/java/com/blessing/bcpedge/UpdatePolicy.java"
          TELE="android-b-edge/src/main/java/com/blessing/bcpedge/TelemetryStore.java"
          MANIFEST="android-b-edge/src/main/AndroidManifest.xml"
          GRADLE="android-b-edge/build.gradle"
          PATHS="android-b-edge/src/main/res/xml/file_paths.xml"
          PINNED="android-b-edge/src/main/java/com/blessing/bcpedge/PinnedTlsHttp.java"

          grep -F 'applicationId "com.blessing.bcpedge.evergreen"' "$GRADLE" >/dev/null
          python - <<'PY'
          import json, pathlib
          manifest=pathlib.Path('release/android_candidate.json') if pathlib.Path('release/android_candidate.json').is_file() else pathlib.Path('release/android.json')
          ar=json.loads(manifest.read_text(encoding='utf-8'))
          gradle=pathlib.Path('android-b-edge/build.gradle').read_text(encoding='utf-8')
          client=pathlib.Path('android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java').read_text(encoding='utf-8')
          code=int(ar['version_code']); name=str(ar['version_name']); core=name.removesuffix('-evergreen')
          assert f'versionCode {code}' in gradle, 'versionCode drift'
          assert f'versionName "{name}"' in gradle, 'versionName drift'
          assert f'private static final String EDGE_VERSION = "{core}";' in client, 'EDGE_VERSION drift'
          PY
          grep -F 'BCP Edge Server' "$MANIFEST" >/dev/null
          grep -F '0baad4749918f1b2430bbbf3f5ddbdb1de4908b017910d67aef2cb987ddeb617' "$UPDATE" >/dev/null
          grep -F '/v1/edge/update' "$UPDATE" >/dev/null
          grep -F '/v1/edge/update/apk' "$UPDATE" >/dev/null
          grep -F 'EDGE_MANIFEST_TRUST_POLICY_FAILED' "$UPDATE" >/dev/null
          grep -F 'APK_SIGNING_CERT_MISMATCH' "$UPDATE" >/dev/null
          grep -F 'getCacheDir()' "$UPDATE" >/dev/null
          grep -F '<cache-path name="updates" path="updates/" />' "$PATHS" >/dev/null
          grep -F 'expected_revision' "$CLIENT" >/dev/null
          grep -F 'pending_checkpoint_idem' "$CLIENT" >/dev/null
          grep -F 'runQuickAcceptance' "$CLIENT" >/dev/null
          grep -F 'Identifiants: masqués' "$MAIN" >/dev/null
          grep -F 'TEST RAPIDE B-EDGE' "$MAIN" >/dev/null
          grep -F 'trustedManifest' "$POLICY" >/dev/null
          grep -F 'EdgeOrchestrator' "$CLIENT" >/dev/null
          grep -F 'syncOrchestrationState' "$CLIENT" >/dev/null
          grep -F 'EDGE_ONLY' android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java >/dev/null
          grep -F 'PC_MEMORY_PRESSURE' android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java >/dev/null
          grep -F 'WAITING_FOR_PC' android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java >/dev/null

          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' "$MANIFEST" >/dev/null
          grep -F 'android.permission.NEARBY_WIFI_DEVICES' "$MANIFEST" >/dev/null
          grep -F 'android.permission.BLUETOOTH_SCAN' "$MANIFEST" >/dev/null
          grep -F 'android.permission.POST_NOTIFICATIONS' "$MANIFEST" >/dev/null
          grep -F 'remoteMessaging|connectedDevice' "$MANIFEST" >/dev/null
          grep -F 'EdgeBootReceiver' "$MANIFEST" >/dev/null
          grep -F 'EdgePermissionManager' "$MAIN" >/dev/null
          grep -F 'BCP Edge Server' "$MAIN" >/dev/null
          grep -F 'EN UN COUP D’ŒIL' "$MAIN" >/dev/null
          grep -F 'ACTION REQUISE' "$MAIN" >/dev/null
          grep -F 'MISSIONS RÉCENTES' "$MAIN" >/dev/null
          grep -F 'APPAREILS CONNUS' "$MAIN" >/dev/null
          grep -F 'CONFIANCE & TRANSPORT' "$MAIN" >/dev/null
          grep -F 'REPAIRS' "$MAIN" >/dev/null
          grep -F 'AUTORISATIONS & 24/7' "$MAIN" >/dev/null
          grep -F 'output.setVisibility(View.GONE)' "$MAIN" >/dev/null
          grep -F 'LAST_SCREEN_KEY' "$MAIN" >/dev/null
          grep -F 'onBackPressed' "$MAIN" >/dev/null
          if grep -F 'PARAMÈTRES / DIAGNOSTIC' "$MAIN"; then
            echo "Operational actions regressed into Settings"
            exit 1
          fi
          grep -F 'DEDICATED_EDGE_API_SERVER' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayService.java >/dev/null
          grep -F '/v1/node/capabilities' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayPolicy.java >/dev/null
          grep -F '/v1/node/jobs' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayPolicy.java >/dev/null
          grep -F '/v1/node/mission-steps' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayPolicy.java >/dev/null
          grep -F '/v1/node/capability-registry' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayPolicy.java >/dev/null
          grep -F '/v1/node/memory-claims' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayPolicy.java >/dev/null
          grep -F 'mission_step_envelope_v1' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayService.java >/dev/null
          grep -F 'memory_admission_ledger' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayService.java >/dev/null
          grep -F 'capability_registry' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayService.java >/dev/null
          grep -F 'Migration(4, 5)' android-b-edge/src/main/java/com/blessing/bcpedge/storage/EdgeDatabase.java >/dev/null
          grep -F 'EdgePresenceAdvertiser' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeRelayService.java >/dev/null
          grep -F 'EdgeContentStore' "$CLIENT" >/dev/null
          grep -F 'SECURE_PC_TRANSPORT_REQUIRED' "$CLIENT" >/dev/null
          grep -F 'migratePairedServerToTls' "$CLIENT" >/dev/null
          grep -F 'PC_TLS_PIN_MISMATCH' "$PINNED" >/dev/null
          grep -F 'MessageDigest.isEqual' "$PINNED" >/dev/null
          grep -F 'X-BCP-Edge-Version' "$PINNED" >/dev/null
          if grep -F 'setRequestProperty("Authorization"' "$CLIENT" "$UPDATE"; then
            echo "Direct HttpURLConnection bearer path reintroduced"
            exit 1
          fi
          grep -F 'MAX_QUOTA = 8L * 1024L * 1024L * 1024L' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeContentStore.java >/dev/null
          grep -F 'DATA_SAVER' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeNetworkState.java >/dev/null
          grep -F 'STORE_AND_FORWARD' android-b-edge/src/main/java/com/blessing/bcpedge/EdgeNetworkState.java >/dev/null
          echo "EDGE_FULL_NODE_STATIC_GUARDS=PASS"

          if grep -E 'output\.setText\([^)]*token|detail\.setText\([^)]*token' "$MAIN"; then
            echo "Credential rendering regression detected"
            exit 1
          fi
          if grep -R -E 'BCP_EDGE_EVERGREEN_SIGNING|storepass|keypass' android-b-edge release/android.json; then
            echo "Private signing material must never enter public source"
            exit 1
          fi
          echo "EDGE_EVERGREEN_STATIC_GUARDS=PASS"

      - name: Unit tests
        run: gradle :android-b-edge:testDebugUnitTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"

      - name: Android lint
        run: gradle :android-b-edge:lintDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"

      - name: Build debug and unsigned release APKs
        run: gradle :android-b-edge:assembleDebug :android-b-edge:assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"

      - name: Artifact contract
        shell: bash
        run: |
          set -euo pipefail
          DEBUG="android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk"
          RELEASE="android-b-edge/build/outputs/apk/release/android-b-edge-release-unsigned.apk"
          test -s "$DEBUG"
          test -s "$RELEASE"
          sha256sum "$DEBUG" | tee android-b-edge-debug.apk.sha256
          sha256sum "$RELEASE" | tee android-b-edge-release-unsigned.apk.sha256
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$RELEASE" | tee android-b-edge-release.badging.txt
          EXPECTED_CODE=$(python -c "import json; print(json.load(open('release/android_candidate.json'))['version_code'])")
          EXPECTED_NAME=$(python -c "import json; print(json.load(open('release/android_candidate.json'))['version_name'])")
          grep -F "package: name='com.blessing.bcpedge.evergreen' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_NAME'" android-b-edge-release.badging.txt >/dev/null
          echo "EDGE_UNSIGNED_RELEASE_CONTRACT=PASS"

      - name: Export Android signing verifier tool
        shell: bash
        run: |
          set -euo pipefail
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar ./apksigner.jar
          test -s ./apksigner.jar
          sha256sum ./apksigner.jar | tee apksigner.jar.sha256

      - name: Android build proof manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BCP_ANDROID_PRODUCT_PROOF=PASS"
            cat android-b-edge-release-unsigned.apk.sha256
            cat apksigner.jar.sha256
            grep -m1 "package: name='com.blessing.bcpedge.evergreen'" android-b-edge-release.badging.txt
          } | tee android-build-proof.txt

      - id: upload_unsigned
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-b-edge-evergreen-unsigned
          path: |
            android-b-edge/build/outputs/apk/release/android-b-edge-release-unsigned.apk
            android-b-edge-release-unsigned.apk.sha256
            android-b-edge-release.badging.txt
            apksigner.jar
            apksigner.jar.sha256
            android-build-proof.txt
          if-no-files-found: error

      - name: Record artifact-provider outcome
        if: always()
        shell: bash
        run: |
          echo "BCP_ANDROID_ARTIFACT_PROVIDER_OUTCOME=${{ steps.upload_unsigned.outcome }}"
          if [ "${{ steps.upload_unsigned.outcome }}" != "success" ]; then
            echo "BCP_ANDROID_ARTIFACT_PROVIDER_DEGRADED=TRUE"
            echo "Product build/tests/hash contract passed; publication remains blocked until a later artifact/readback gate succeeds."
          fi
