name: BCP Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-b-edge/**"
      - "settings.gradle"
      - "build.gradle"
      - "pc-node/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  test-pc-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PC node tests
        run: python pc-node/test_bcp.py

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :android-b-edge:assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"
      - name: SHA-256
        run: sha256sum android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk | tee android-b-edge-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-b-edge-debug-apk
          path: |
            android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk
            android-b-edge-debug.apk.sha256
          if-no-files-found: error
