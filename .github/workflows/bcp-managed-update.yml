name: BCP Managed Server Update

on:
  workflow_dispatch:
  push:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/bcp_server.py"
      - "release/server.json"
      - ".github/workflows/bcp-managed-update.yml"
  pull_request:
    paths:
      - ".project-memory/QUALIFICATION_TRIGGER.json"
      - "windows/bcp_server.py"
      - "release/server.json"
      - ".github/workflows/bcp-managed-update.yml"

permissions:
  contents: read

concurrency:
  group: bcp-managed-server-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Server self-test
        run: python windows/bcp_server.py --selftest

      - name: Build proof-carrying managed update package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(".")
          server = root / "windows" / "bcp_server.py"
          release = json.loads((root / "release" / "server.json").read_text(encoding="utf-8"))
          raw = server.read_bytes()
          text = raw.decode("utf-8")
          sha = hashlib.sha256(raw).hexdigest()
          m = re.search(r'^SERVER_VERSION\s*=\s*"([^"]+)"', text, re.M)
          if not m:
              raise SystemExit("server source version missing")
          source_version = m.group(1)
          ref = os.environ.get("GITHUB_REF", "")
          stable_ref = ref == "refs/heads/main"
          if stable_ref:
              if sha != release["sha256"]:
                  raise SystemExit(f"stable release hash mismatch: {sha} != {release['sha256']}")
              if source_version != str(release["version"]):
                  raise SystemExit(f"stable release version mismatch: {source_version} != {release['version']}")
              version = str(release["version"])
              qualification = "STABLE_MAIN"
          else:
              version = source_version
              qualification = "CANDIDATE_BRANCH"
              print(json.dumps({
                  "candidate_ref": ref,
                  "candidate_version": version,
                  "candidate_sha256": sha,
                  "stable_release_version": release.get("version"),
                  "note": "branch qualification does not promote release/server.json"
              }))
          pkg = root / "package"
          (pkg / "payload").mkdir(parents=True, exist_ok=True)
          (pkg / "payload" / "server.py").write_bytes(raw)
          manifest = {
              "schema": 1,
              "package_type": "managed_app_update",
              "qualification": qualification,
              "source_ref": ref,
              "target_app": "bcp",
              "sequence": 202609190500,
              "version": version,
              "update_id": "bcp-server-" + version + "-recovery-bridge",
              "files": [{"path": "server.py", "sha256": sha}],
              "manifest_patch": {
                  "test_timeout": 45,
                  "log_paths": [
                      "logs/http.log",
                      "logs/install.jsonl",
                      "logs/server-update-restart.log",
                      "telemetry/phone-events.jsonl",
                      "state/server_update.json"
                  ]
              }
          }
          (pkg / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps({"version": version, "sha256": sha, "sequence": manifest["sequence"]}))
          PY

      - name: Recheck package payload
        shell: bash
        run: |
          set -euo pipefail
          python package/payload/server.py --selftest
          python - <<'PY'
          import hashlib, json, pathlib
          m = json.loads(pathlib.Path("package/manifest.json").read_text())
          p = pathlib.Path("package/payload/server.py")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == m["files"][0]["sha256"]
          assert m["target_app"] == "bcp"
          assert m["package_type"] == "managed_app_update"
          print("BCP_MANAGED_UPDATE_PACKAGE=PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bcp-managed-update
          path: |
            package/manifest.json
            package/payload/server.py
          if-no-files-found: error
          retention-days: 7
