name: BCP Coordinated Product Qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "windows/bcp_server.py"
      - "android-b-edge/**"
      - "release/server.json"
      - "release/android.json"
      - "release/android_candidate.json"
      - "docs/CANONICAL_PRODUCT_REQUIREMENTS.md"
      - ".github/workflows/coordinated-product.yml"
      - ".github/workflows/coordinated-pc-package.yml"

permissions:
  contents: read

concurrency:
  group: bcp-coordinated-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server release contract
        shell: powershell
        run: |
          $release=Get-Content -Raw '.\release\server.json' -Encoding UTF8|ConvertFrom-Json
          $server=Get-Content -Raw '.\windows\bcp_server.py' -Encoding UTF8
          $version=[string]$release.version
          if(-not $version){throw 'server release version missing'}
          if(-not [string]$release.coordinated_edge_version){throw 'server/edge coordination missing'}
          if($server -notmatch ('SERVER_VERSION = "'+[regex]::Escape($version)+'"')){throw 'server source version drift'}
          if($server -notmatch '/v1/orchestrator/status'){throw 'orchestrator status missing'}
          if($server -notmatch 'memory_records'){throw 'memory schema missing'}
          if($server -notmatch 'WAITING_FOR_PC'){throw 'resource-aware job queue missing'}
      - name: Server self-test
        run: python .\windows\bcp_server.py --selftest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Coordinated Android contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          manifest=pathlib.Path('release/android_candidate.json')
          candidate=manifest.is_file()
          if not candidate: manifest=pathlib.Path('release/android.json')
          ar=json.loads(manifest.read_text(encoding='utf-8'))
          sr=json.loads(pathlib.Path('release/server.json').read_text(encoding='utf-8'))
          gradle=pathlib.Path('android-b-edge/build.gradle').read_text(encoding='utf-8')
          client=pathlib.Path('android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java').read_text(encoding='utf-8')
          code=int(ar['version_code']); name=str(ar['version_name']); edge_core=name.removesuffix('-evergreen')
          assert f'versionCode {code}' in gradle, 'Android versionCode drift'
          assert f'versionName "{name}"' in gradle, 'Android versionName drift'
          assert f'private static final String EDGE_VERSION = "{edge_core}";' in client, 'BcpClient EDGE_VERSION drift'
          def version_tuple(value): return tuple(int(x) if x.isdigit() else 0 for x in str(value).split('-', 1)[0].split('.'))
          assert version_tuple(sr['version']) >= version_tuple(ar['minimum_server_version']), 'Android minimum server compatibility drift'
          assert ar['coordinated_server_version'] == sr['version'], 'Android coordinated server drift'
          if candidate:
              stable=json.loads(pathlib.Path('release/android.json').read_text(encoding='utf-8'))
              assert ar['publication_allowed'] is False, 'candidate must remain non-publishable before signing'
              assert int(ar['version_code']) > int(stable['version_code']), 'candidate versionCode must advance stable'
              assert ar['package_id'] == stable['package_id'], 'candidate package identity drift'
              assert ar['expected_signing_cert_sha256'] == stable['signing_cert_sha256'], 'candidate cert identity drift'
          else:
              assert sr['coordinated_edge_version'] == name, 'server/edge version contract drift'
              if sr.get('release_train') or ar.get('release_train'): assert sr.get('release_train') == ar.get('release_train'), 'release train drift'
          PY
          grep -F 'EdgeOrchestrator' android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java
          grep -F 'EDGE_ONLY' android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java
          grep -F 'PC_MEMORY_PRESSURE' android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java
          grep -F 'WAITING_FOR_PC' android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java
          grep -F 'EdgeSentinelEntity.class' android-b-edge/src/main/java/com/blessing/bcpedge/storage/EdgeDatabase.java
          grep -F 'Migration(1, 2)' android-b-edge/src/main/java/com/blessing/bcpedge/storage/EdgeDatabase.java
          grep -F 'PC_UNAVAILABLE_RECOVERY' android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java
          grep -F '15, TimeUnit.MINUTES, 5, TimeUnit.MINUTES' android-b-edge/src/main/java/com/blessing/bcpedge/work/EdgeWorkScheduler.java
          grep -F 'return Result.success(out);' android-b-edge/src/main/java/com/blessing/bcpedge/work/EdgeReconcileWorker.java
      - name: Unit tests
        run: gradle :android-b-edge:testDebugUnitTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"
      - name: Lint
        run: gradle :android-b-edge:lintDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"
      - name: Build APKs
        run: gradle :android-b-edge:assembleDebug :android-b-edge:assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"
      - name: Package contract
        shell: bash
        run: |
          set -euo pipefail
          DEBUG=android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk
          RELEASE=android-b-edge/build/outputs/apk/release/android-b-edge-release-unsigned.apk
          test -s "$DEBUG"
          test -s "$RELEASE"
          sha256sum "$DEBUG" > android-b-edge-debug.apk.sha256
          sha256sum "$RELEASE" > android-b-edge-release-unsigned.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bcp-edge-coordinated
          path: |
            android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk
            android-b-edge/build/outputs/apk/release/android-b-edge-release-unsigned.apk
            android-b-edge-debug.apk.sha256
            android-b-edge-release-unsigned.apk.sha256

  compatibility:
    runs-on: ubuntu-latest
    needs: [server, android]
    steps:
      - uses: actions/checkout@v4
      - name: Cross-component release contract
        shell: python
        run: |
          import json, pathlib, re, hashlib
          sr=json.loads(pathlib.Path("release/server.json").read_text())
          manifest=pathlib.Path("release/android_candidate.json")
          candidate=manifest.is_file()
          if not candidate: manifest=pathlib.Path("release/android.json")
          ar=json.loads(manifest.read_text())
          server=pathlib.Path("windows/bcp_server.py").read_bytes()
          client=pathlib.Path("android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java").read_text()
          def version_tuple(value): return tuple(int(x) if x.isdigit() else 0 for x in str(value).split("-", 1)[0].split("."))
          assert version_tuple(sr["version"]) >= version_tuple(ar["minimum_server_version"])
          assert sr["version"] == ar["coordinated_server_version"]
          if candidate:
              stable=json.loads(pathlib.Path("release/android.json").read_text())
              assert ar["publication_allowed"] is False
              assert int(ar["version_code"]) > int(stable["version_code"])
              assert ar["expected_signing_cert_sha256"] == stable["signing_cert_sha256"]
          else:
              assert sr["coordinated_edge_version"] == ar["version_name"]
              if sr.get("release_train") or ar.get("release_train"):
                  assert sr.get("release_train") == ar.get("release_train")
          assert hashlib.sha256(server).hexdigest() == sr["sha256"]
          for endpoint in ["/v1/orchestrator/status", "/context", "/jobs"]:
              assert endpoint in client or endpoint in server.decode()
          print("BCP_COORDINATED_COMPATIBILITY=PASS")
