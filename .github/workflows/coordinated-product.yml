name: BCP Coordinated Product Qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "windows/**"
      - "android-b-edge/**"
      - "release/**"
      - "docs/CANONICAL_PRODUCT_REQUIREMENTS.md"
      - ".github/workflows/coordinated-product.yml"

permissions:
  contents: read

concurrency:
  group: bcp-coordinated-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Coordinated server contract
        shell: powershell
        run: |
          $release=Get-Content -Raw '.\release\server.json' -Encoding UTF8|ConvertFrom-Json
          $server=Get-Content -Raw '.\windows\bcp_server.py' -Encoding UTF8
          if($release.version -ne '0.6.0'){throw 'server release version drift'}
          if($release.coordinated_edge_version -ne '2.0.0-rc1-evergreen'){throw 'server/edge coordination drift'}
          if($server -notmatch 'SERVER_VERSION = "0.6.0"'){throw 'server source version drift'}
          foreach($needle in @(
            '/v1/orchestrator/status',
            'bcp.context_pack/2',
            'evidence_class',
            'coordinator_epoch',
            'job_dependencies',
            '_bcp._tcp.local',
            'PC_MEMORY_PRESSURE',
            '384 * 1024 * 1024',
            '640 * 1024 * 1024'
          )) { if($server -notmatch [regex]::Escape($needle)){throw "server contract missing $needle"} }

      - name: Server self-test
        run: python .\windows\bcp_server.py --selftest

      - name: Installer self-test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\INSTALL_BCP_FINAL.ps1' -SelfTest

      - name: Acceptance runner self-test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\windows\BCP_FINAL_ACCEPTANCE_CURRENT.ps1' -SelfTest

      - name: Verify release SHA
        shell: python
        run: |
          import hashlib,json,pathlib
          raw=pathlib.Path("windows/bcp_server.py").read_bytes()
          rel=json.loads(pathlib.Path("release/server.json").read_text())
          assert hashlib.sha256(raw).hexdigest()==rel["sha256"]
          print("BCP_SERVER_SHA=PASS")

      - uses: actions/upload-artifact@v4
        with:
          name: bcp-pc-0.6.0
          path: |
            windows/bcp_server.py
            windows/INSTALL_BCP_FINAL.ps1
            windows/INSTALL_BCP_FINAL.cmd
            windows/BCP_FINAL_ACCEPTANCE_CURRENT.ps1
            windows/BCP_FINAL_ACCEPTANCE_CURRENT.cmd
            release/server.json
            release/android.json
            release/COORDINATED_COVERAGE_CURRENT.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: V2 Android static contract
        shell: bash
        run: |
          set -euo pipefail
          GRADLE=android-b-edge/build.gradle
          CLIENT=android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java
          ORCH=android-b-edge/src/main/java/com/blessing/bcpedge/EdgeOrchestrator.java
          DB=android-b-edge/src/main/java/com/blessing/bcpedge/storage/EdgeDatabase.java
          DAO=android-b-edge/src/main/java/com/blessing/bcpedge/storage/EdgeDao.java
          POLICY=android-b-edge/src/main/java/com/blessing/bcpedge/EdgePolicy.java
          GOV=android-b-edge/src/main/java/com/blessing/bcpedge/EdgeResourceGovernor.java
          NSD=android-b-edge/src/main/java/com/blessing/bcpedge/NsdDiscovery.java
          WORK=android-b-edge/src/main/java/com/blessing/bcpedge/EdgeReconcileWorker.java

          grep -F 'versionCode 200' "$GRADLE" >/dev/null
          grep -F 'versionName "2.0.0-rc1-evergreen"' "$GRADLE" >/dev/null
          grep -F 'EDGE_VERSION = "2.0.0-rc1"' "$CLIENT" >/dev/null
          ! grep -F 'private static final String PROJECT = "buildhub"' "$CLIENT"
          grep -F 'EdgeDatabase.get' "$ORCH" >/dev/null
          grep -F 'EDGE_QUEUE_BACKPRESSURE' "$ORCH" >/dev/null
          ! grep -F 'while (q.length() > EdgePolicy.boundedQueueLimit())' "$ORCH"
          grep -F 'Migration(1, 2)' "$DB" >/dev/null
          ! grep -F 'fallbackToDestructiveMigration' "$DB"
          grep -F 'admitJob' "$DAO" >/dev/null
          grep -F 'unresolvedDependencies' "$DAO" >/dev/null
          grep -F 'EDGE_R2' "$POLICY" >/dev/null
          grep -F 'REMOTE_AI' "$POLICY" >/dev/null
          grep -F 'getCurrentThermalStatus' "$GOV" >/dev/null
          grep -F '_bcp._tcp.' "$NSD" >/dev/null
          grep -F 'PeriodicWorkRequest' "$WORK" >/dev/null
          grep -F '"minimum_server_version": "0.6.0"' release/android.json >/dev/null

      - name: Unit tests
        run: gradle :android-b-edge:testDebugUnitTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"

      - name: Lint
        run: gradle :android-b-edge:lintDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"

      - name: Build APKs
        run: gradle :android-b-edge:assembleDebug :android-b-edge:assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8"

      - name: APK contract
        shell: bash
        run: |
          set -euo pipefail
          DEBUG=android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk
          RELEASE=android-b-edge/build/outputs/apk/release/android-b-edge-release-unsigned.apk
          test -s "$DEBUG"
          test -s "$RELEASE"
          sha256sum "$DEBUG" > android-b-edge-debug.apk.sha256
          sha256sum "$RELEASE" > android-b-edge-release-unsigned.apk.sha256
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$RELEASE" | tee android-b-edge-release.badging.txt
          grep -F "package: name='com.blessing.bcpedge.evergreen' versionCode='200'" android-b-edge-release.badging.txt >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: bcp-edge-2.0.0-rc1-unsigned
          path: |
            android-b-edge/build/outputs/apk/debug/android-b-edge-debug.apk
            android-b-edge/build/outputs/apk/release/android-b-edge-release-unsigned.apk
            android-b-edge-debug.apk.sha256
            android-b-edge-release-unsigned.apk.sha256
            android-b-edge-release.badging.txt
          if-no-files-found: error

  compatibility:
    runs-on: ubuntu-latest
    needs: [server, android]
    steps:
      - uses: actions/checkout@v4
      - name: Cross-component release contract
        shell: python
        run: |
          import json,pathlib,hashlib
          sr=json.loads(pathlib.Path("release/server.json").read_text())
          ar=json.loads(pathlib.Path("release/android.json").read_text())
          cov=json.loads(pathlib.Path("release/COORDINATED_COVERAGE_CURRENT.json").read_text())
          server=pathlib.Path("windows/bcp_server.py").read_bytes()
          client=pathlib.Path("android-b-edge/src/main/java/com/blessing/bcpedge/BcpClient.java").read_text()
          assert sr["version"] == ar["minimum_server_version"] == ar["coordinated_server_version"] == "0.6.0"
          assert sr["coordinated_edge_version"] == ar["version_name"] == "2.0.0-rc1-evergreen"
          assert sr["release_train"] == ar["release_train"] == cov["release_train"]
          assert hashlib.sha256(server).hexdigest() == sr["sha256"]
          for endpoint in ["/v1/orchestrator/status","/context","/jobs"]:
              assert endpoint in client or endpoint in server.decode()
          ids={x["id"]:x for x in cov["capabilities"]}
          for required in [
              "android_room_durable_state","multi_project_registry",
              "durable_priority_queue_backpressure","job_dependency_dag",
              "memory_evidence_provenance","context_pack_v2",
              "resource_governor_android","resource_governor_pc",
              "nsd_mdns_discovery"
          ]:
              assert "IMPLEMENTED" in ids[required]["state"], required
          assert "DEFERRED" in ids["authenticated_encrypted_lan_transport"]["state"]
          assert "DEFERRED" in ids["edge_authority_migration"]["state"]
          print("BCP_COORDINATED_COMPATIBILITY=PASS")

  package:
    runs-on: ubuntu-latest
    needs: [server, android, compatibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bcp-pc-0.6.0
          path: stage/pc
      - uses: actions/download-artifact@v4
        with:
          name: bcp-edge-2.0.0-rc1-unsigned
          path: stage/phone
      - name: Assemble coordinated candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/01_PC product/02_PHONE_UNSIGNED product/03_EVIDENCE
          cp stage/pc/windows/bcp_server.py product/01_PC/
          cp stage/pc/windows/INSTALL_BCP_FINAL.ps1 product/01_PC/
          cp stage/pc/windows/INSTALL_BCP_FINAL.cmd product/01_PC/
          cp stage/pc/windows/BCP_FINAL_ACCEPTANCE_CURRENT.ps1 product/01_PC/
          cp stage/pc/windows/BCP_FINAL_ACCEPTANCE_CURRENT.cmd product/01_PC/
          cp stage/phone/android-b-edge/build/outputs/apk/release/android-b-edge-release-unsigned.apk product/02_PHONE_UNSIGNED/
          cp stage/phone/android-b-edge-release-unsigned.apk.sha256 product/03_EVIDENCE/
          cp release/server.json release/android.json release/COORDINATED_COVERAGE_CURRENT.json product/03_EVIDENCE/
          cat > product/README_NEXT_GATE.txt <<'EOF'
          BCP 0.6.0 + B-EDGE 2.0.0-rc1 coordinated candidate.
          Public CI has qualified source, Windows installer/acceptance, Android build/lint/tests and cross-component contracts.
          The APK in 02_PHONE_UNSIGNED is NOT for installation. It must be signed privately with the pinned Evergreen identity before user delivery.
          EOF
          (cd product && find . -type f -print0 | sort -z | xargs -0 sha256sum) > product/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BCP_COORDINATED_0.6.0_EDGE_2.0.0-rc1_CI
          path: product
          if-no-files-found: error
