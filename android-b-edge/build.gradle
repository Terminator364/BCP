plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blessing.bcpedge'
    compileSdk 35

    defaultConfig {
        applicationId "com.blessing.bcpedge"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-poc"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
