plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blessing.bcpedge'
    compileSdk 35

    defaultConfig {
        applicationId "com.blessing.bcpedge"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0-auto"
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
